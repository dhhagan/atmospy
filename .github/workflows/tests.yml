name: run and build
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is intentionally absent: the >=3.9 floor forces the lock onto
        # scipy 1.13.1 / numpy 2.0.2 (last releases supporting 3.9), neither of
        # which ships a cp313 wheel, so Poetry tries to build scipy from source
        # and fails on missing OpenBLAS. Metadata still permits 3.13 for pip
        # users. Raising the floor to 3.11 would let CI cover it again.
        python: ["3.9", "3.10", "3.11", "3.12"]
    name: Python ${{ matrix.python }} tests
    steps:
      - name: Checkout branch
        uses: actions/checkout@v2

      - name: Install poetry
        uses: snok/install-poetry@v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          cache: 'poetry'
      
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests and generate coverage report
        run: |
          poetry run pytest tests/ --cov=./ --cov-report=xml
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          slug: dhhagan/atmospy
          flags: unittests
          name: codecov-umbrella
[project]
name = "atmospy"
version = "0.2.0a1"
description = "Data analysis and visualization for air quality data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "David H. Hagan", email = "david.hagan@quant-aq.com" },
]
requires-python = ">=3.10"
keywords = ["air quality", "atmospheric science", "visualization", "matplotlib", "seaborn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.2",
    "matplotlib>=3.4",
    "seaborn>=0.12",
    "scipy>=1.7",
    "platformdirs>=3",
]

[project.urls]
Homepage = "https://dhhagan.github.io/atmospy/"
Documentation = "https://dhhagan.github.io/atmospy/"
Repository = "https://github.com/dhhagan/atmospy/"
"Bug Tracker" = "https://github.com/dhhagan/atmospy/issues"

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
]
docs = [
    "sphinx<6.0.0",
    "sphinx-copybutton>=0.5.2,<0.6",
    "pydata-sphinx-theme==0.10.0rc2",
    "numpydoc>=1.5",
    "sphinx-issues>=4.1.0",
    "sphinx-design>=0.5.0",
    "nbconvert>=7.16.3",
    "ipykernel>=6.29.4",
    "jupyter>=1.0.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atmospy"]

[tool.hatch.build.targets.sdist]
only-include = ["atmospy", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: downloads the example datasets; skipped unless --run-network is given",
]
